[project]
name = "nesting"
version = "0.1.0"
description = "Optimizacion de cortes en placas a partir de archivos vectoriales"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "scipy",
    "shapely",
    "ezdxf",
    "Pillow",
    "PyYAML",
    "rhino3dm",
    "fastapi",
    "uvicorn",
    "pywebview",
    # Obligatorio para recibir archivos subidos (POST /api/archivos).
    # Sin esto FastAPI rechaza el multipart con un error que no
    # nombra la causa, y sólo en la máquina donde falta.
    "python-multipart",
]

[project.optional-dependencies]
# httpx sólo lo usa TestClient de FastAPI en los tests de la API; ningún
# módulo de src/ lo importa, por eso va en dev y no en dependencies.
# pyinstaller arma el ejecutable de escritorio (packaging/); tampoco lo
# importa ningún módulo de src/.
dev = ["pytest", "httpx", "pyinstaller"]

[project.scripts]
nest = "nesting.cli:main"
nest-app = "nesting_app.desktop:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Los patrones aquí son glob patterns relativos a la raíz del paquete (src/nesting_app/).
# `web/*` toma archivos/carpetas no ocultos directamente en web/ (nivel 1).
# `web/.*` toma archivos/carpetas ocultos (comenzando con .) en web/ (nivel 1).
# `web/**/*` toma archivos a cualquier profundidad en subcarpetas de web/ (recursivo).
# `web/**/.*` toma archivos ocultos a cualquier profundidad en subcarpetas de web/.
# Se necesitan los cuatro porque: (1) glob no incluye .ocultos con `*`, (2) `**` sin `/*`
# no coincide con archivos finales, (3) los .ocultos en nivel 1 no son capturados por `web/**/*`.
# Sin esto, subcarpetas como web/img/ o web/fuentes/ (y sus contenidos) se pierden al
# empaquetar sin error ni aviso.
nesting_app = ["web/*", "web/.*", "web/**/*", "web/**/.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
